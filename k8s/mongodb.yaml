apiVersion: apps/v1
kind: Deployment
metadata: {name: medisphere-mongodb}
spec:
  replicas: 1
  selector: {matchLabels: {app: medisphere-mongodb}}
  template:
    metadata: {labels: {app: medisphere-mongodb}}
    spec:
      containers:
      - name: mongodb
        image: mongo:8
        ports: [{containerPort: 27017}]
---
apiVersion: v1
kind: Service
metadata: {name: medisphere-mongodb}
spec:
  selector: {app: medisphere-mongodb}
  ports: [{port: 27017,targetPort: 27017}]
