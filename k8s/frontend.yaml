apiVersion: apps/v1
kind: Deployment
metadata: {name: medisphere-frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: medisphere-frontend}}
  template:
    metadata: {labels: {app: medisphere-frontend}}
    spec:
      containers:
      - name: frontend
        image: medisphere/frontend:1.0
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: medisphere-frontend}
spec:
  type: LoadBalancer
  selector: {app: medisphere-frontend}
  ports: [{port: 80,targetPort: 80}]
